[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
handlers = console
level = WARNING
qualname = 

[logger_sqlalchemy]
handlers = 
level = WARNING
qualname = sqlalchemy.engine

[logger_alembic]
handlers = 
level = INFO
qualname = alembic

[handler_console]
args = (sys.stderr,)
class = StreamHandler
formatter = generic
level = NOTSET

[formatter_generic]
datefmt = %H:%M:%S
format = %(levelname)-5.5s [%(name)s] %(message)s
